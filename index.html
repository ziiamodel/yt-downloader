<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h1 class="text-center">YouTube Video Downloader</h1>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="videoUrl" class="form-label">YouTube Video URL</label>
                            <input type="text" class="form-control" id="videoUrl" placeholder="Enter YouTube URL">
                        </div>
                        <button id="getInfoBtn" class="btn btn-primary w-100">Get Video Info</button>
                        
                        <div id="videoInfo" class="mt-4" style="display: none;">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <img id="thumbnail" src="" alt="Video thumbnail" class="img-fluid rounded">
                                        </div>
                                        <div class="col-md-8">
                                            <h5 id="title"></h5>
                                            <p id="duration"></p>
                                            <div class="mb-3">
                                                <label for="formatSelect" class="form-label">Select Format</label>
                                                <select id="formatSelect" class="form-select">
                                                    <!-- Options will be populated dynamically -->
                                                </select>
                                            </div>
                                            <button id="downloadBtn" class="btn btn-success">Download</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="progressContainer" class="mt-3" style="display: none;">
                            <div class="progress">
                                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                            <p id="progressText" class="text-center mt-2"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
